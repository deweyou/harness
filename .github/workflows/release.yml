name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Refresh main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - run: pnpm install --frozen-lockfile

      - name: Prepare version and changelog
        id: release
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/prepare-release.mjs --base "$EVENT_BEFORE" --github-output "$GITHUB_OUTPUT"

      - name: Build and validate release
        if: steps.release.outputs.changed == 'true'
        run: |
          pnpm run check
          pnpm run test:coverage
          pnpm run validate:plugin
          git diff --check

      - name: Commit release artifacts
        if: steps.release.outputs.changed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .codex-plugin/plugin.json .claude-plugin/plugin.json .claude-plugin/marketplace.json .trae-plugin/plugin.json plugin.json openclaw.plugin.json CHANGELOG.md dist/server.mjs
          git commit -m "chore(release): v${RELEASE_VERSION} [skip ci]"
          git push origin HEAD:main
